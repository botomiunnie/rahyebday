.modal{position:relative;width:min(95vw,490px);max-height:min(88dvh,700px);overflow:auto;background:#fffbf6;border:7px solid #ffe1e7;outline:4px solid #e65191;border-radius:15px;box-shadow:0 9px 0 #8f2d55,0 19px 60px #2a071a88;text-align:center;padding:28px 20px 26px}

.modal h2{font-family:'Caveat','Bradley Hand','Apple Chancery',cursive;font-weight:600;color:#a83a65;font-size:37px;margin:8px 0 12px}
.modal p{font-size:14px;line-height:1.7}.modal .close{position:absolute;right:8px;top:19px;background:#ffecf2;color:#a42f67;border:2px solid #fba5c1;border-radius:50%;width:32px;height:32px;font-size:19px;z-index:2}

const LETTER_TEXT = "To. 라혜\n\n라혜야 안녕 벌써 너의 생일이 됐네\n너가 편지를 써 달라고 했는데 뭔가 특이하게 해 주고 싶어서\n내가 할 수 있는 최선의 방법을 생각해 냈어.\n어떻게 구현하면 좋을까 생각하다가 뭔가 귀여운걸로 해봄!\n마음에 들었으면 좋겠어.\n\n벌써 시간이 이렇게 흘러 우리가 벌써 20대의 중반에 들어선게 너무 소름끼쳐!\n우리가 같이 얘기를 나눴던건 21살인데, 25살을 바라보고 있는게...\n시간이 우리를 기다려주지 않는다는 생각을 많이 하고는 해.\n그때랑 비교하면 정말 많은게 변했고, 또 많은 일을 겪었고, 또 서로 하고 있는 것도 너무 다르고!!!\n\n너랑 엄청엄청 자주 만나고 자주 대화하는건 아니지만 계속해서 이렇게 뜨뜻미지근해도\n우리의 우정이 이어가기를 항상 바라고 있단다??\n(넌 속으로 아닐거라고 생각하지만 진짜임...)\n너가 내 편지를 다시 읽으며 깊생을 했다고 했을 때도, 뭔가 놀랐지만 너가 어떤 점에서 그렇게 생각했는지는 이해는 했어.\n앞으로 더 노력하도록 할겤ㅋㅋㅋ\n\n세상 여자 같고, 여리여리해 보이지만 그 속은 전투적이고, 진취적인 너를 보며\n아 라혜는 어떻게 이런 정보를 알아서 이런 준비를 할까 싶은 생각이 들어\n항상 무언가를 해보기로 마음 먹고 실행을 옮기는게 얼마나 힘든 일인지\n대학교를 제대로 다니면서 매 학기마다 더 절실히 느끼게 되는거 같아.\n그리고 이 세상은 항상 기회를 좇는 사람들에게 더 많은 것을 이룰 수 있게 한다는 것도 말이야.\n\n이번에 준비하는 시험도 최선의 결과를 받아서 너가 원하는 곳에 합격하는 그날까지\n너에게 무한한 지지를 보낼게!\n내가 항상 하는 말이지만 부끄러울 수 있어도 과정과 결과를 공유하고, 또 항상 용기를 내는 너를 본 받으려고 하고 있어.\n그래서 하는 말인데 나도 내년에는 시험 준비한다??!!\n걍 자세한 얘기는 만나서 하자!!! 놀자놀자\n\n생일추카해 (∗❛⌄❛∗)\n\nFrom. 유민";
let serverClockOffset=0;
let serverTimeReady=false;
function nowKstTimestamp(){return Date.now()+serverClockOffset}
// 배포된 사이트에서는 서버 Date 헤더를 기준으로 시각을 보정합니다. 로컬 열람 시 기기 시각을 사용.
async function syncClock(){
  if(location.protocol!=='https:'&&location.protocol!=='http:')return;
  try{
    const before=Date.now();
    const url=new URL(location.href);url.searchParams.set('clock',''+before);
    const r=await fetch(url.toString(),{method:'HEAD',cache:'no-store'});
    const header=r.headers.get('date');
    if(r.ok&&header){serverClockOffset=Date.parse(header)-Math.round((before+Date.now())/2);serverTimeReady=true;updateRelease()}
  }catch(e){/* Fall back to device clock. */}
}
const STATIONS_DESKTOP = [
 [42.0,34.4],[50.3,28.7],[58.4,34.0],[62.7,46.0],[55.4,55.0],[45.2,55.2],[39.4,46.0]
];
const STATIONS_MOBILE = [
 [31.8,22.5],[50.3,11.7],[69.8,22.1],[75.8,45.4],[62.2,63.2],[39.0,63.6],[25.4,46.0]
];
const TOTAL=7;
// Key: strawberry that was picked up from the tray. Value: cake topping slot.
const placed = new Map();
let selected = null, drag=null, toastTimer=null;
const $=s=>document.querySelector(s);

// Four-scene Korean opening. Speaker 1 = left girl; speaker 2 = right girl.
const INTRO_LINES=[
 {speaker:1,text:'11월 14일이 무슨 날인지 알아?'},
 {speaker:2,text:'라혜의 생일이잖아?'},
 {speaker:1,text:'이 케이크에 딸기를 다 얹으면 선물이 나온다는데...'},
 {speaker:2,text:'빨리 딸기를 올려봐!'}
];
let introActive=true,introIndex=0,typingTimer=null,autoNextTimer=null,typedChars=0;
function clearIntroTimers(){if(typingTimer!==null){clearInterval(typingTimer);typingTimer=null}if(autoNextTimer!==null){clearTimeout(autoNextTimer);autoNextTimer=null}}
function putDialogueText(text){
 $('#desktopDialogueText').textContent=text;
 $('#bubble').textContent=text;
}
function showIntroLine(){
 clearIntroTimers();if(!introActive)return;
 const line=INTRO_LINES[introIndex];const chars=Array.from(line.text);typedChars=0;
 $('#desktopDialogue').dataset.speaker=String(line.speaker);
 $('#bubble').dataset.speaker=String(line.speaker);
 document.querySelector('.characters .left-girl').classList.toggle('speaking',line.speaker===1);
 document.querySelector('.characters .right-girl').classList.toggle('speaking',line.speaker===2);
 putDialogueText('');
 typingTimer=setInterval(()=>{
  typedChars=Math.min(typedChars+1,chars.length);
  putDialogueText(chars.slice(0,typedChars).join(''));
  if(typedChars>=chars.length){clearInterval(typingTimer);typingTimer=null;
    autoNextTimer=setTimeout(nextIntro,1500);}
 },38);
}
function nextIntro(){
 if(!introActive)return;
 const full=INTRO_LINES[introIndex].text;
 if(typingTimer!==null){clearIntroTimers();putDialogueText(full);
  autoNextTimer=setTimeout(nextIntro,1500);return}
 clearIntroTimers();introIndex++;
 if(introIndex>=INTRO_LINES.length){finishIntro();return}
 showIntroLine();
}
function finishIntro(){
 if(!introActive)return;
 clearIntroTimers();introActive=false;
 document.querySelector('.app').classList.remove('intro-playing');
 document.querySelectorAll('.characters img').forEach(el=>el.classList.remove('speaking'));
 $('#bubble').removeAttribute('data-speaker');
 $('#desktopDialogue').removeAttribute('data-speaker');
 redraw();
}
$('#desktopDialogue').addEventListener('click',nextIntro);
$('#bubble').addEventListener('click',()=>{if(introActive)nextIntro()});
document.querySelectorAll('[data-skip-intro]').forEach(button=>button.addEventListener('click',e=>{
 e.preventDefault();e.stopPropagation();finishIntro();
}));
document.addEventListener('keydown',e=>{
 if(introActive&&(e.key==='Enter'||e.key===' '||e.key==='ArrowRight')&&
    e.target.tagName!=='BUTTON'){e.preventDefault();nextIntro()}
});
function startIntro(){
 document.querySelector('.app').classList.add('intro-playing');
 $('#mobileTip').textContent='▼ 대화가 끝나면 케이크를 꾸며줘! ▼';
 // The initial berries are present in HTML. Disable their interaction during intro.
 document.querySelectorAll('.berry-item').forEach(b=>b.disabled=true);
 showIntroLine();
}

const mobileMode=()=>window.matchMedia('(max-width:720px)').matches;
function activeCake(){return mobileMode()?$('#mobileCake'):$('#desktopScene')}
function currentStations(){return mobileMode()?STATIONS_MOBILE:STATIONS_DESKTOP}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function redraw(){
  // Preserve each existing strawberry's DOM node, so only the newly added one pops.
  // The berry SOURCE index and the cake DESTINATION slot must remain independent.
  document.querySelectorAll('.placed-layer').forEach((layer,sceneIndex)=>{
   const positions=sceneIndex===0?STATIONS_DESKTOP:STATIONS_MOBILE;
   layer.querySelectorAll('.placed-berry').forEach(img=>{
    if(!placed.has(Number(img.dataset.berryIndex)))img.remove();
   });
   for(const [berryIndex,slot] of placed){
    let berry=layer.querySelector('.placed-berry[data-berry-index="'+berryIndex+'"]');
    if(!berry){
     berry=document.createElement('img');berry.className='placed-berry';
     berry.dataset.berryIndex=String(berryIndex);berry.src=FULL_BERRY;berry.alt='';
     berry.draggable=false;layer.append(berry);
    }
    berry.dataset.slot=String(slot);
    berry.style.left=positions[slot][0]+'%';berry.style.top=positions[slot][1]+'%';
   }
  });
  document.querySelectorAll('.berry-tray').forEach(tray=>{
   for(let i=0;i<TOTAL;i++){
    let b=tray.querySelector('.berry-item[data-index="'+i+'"]');
    if(!b){b=document.createElement('button');b.type='button';b.className='berry-item';b.dataset.index=i;tray.append(b)}
    if(!b.dataset.wired){
     b.dataset.wired='true';b.addEventListener('pointerdown',startDrag);
     b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){
       e.preventDefault();if(introActive)return;selected=i;redraw();toast('이제 케이크 위를 눌러줘!')
     }});
    }
    if(!b.querySelector('img')){
     const img=document.createElement('img');img.src=FULL_BERRY;img.alt='딸기';img.draggable=false;b.append(img)
    }
    b.classList.toggle('used',placed.has(i));b.classList.toggle('selected',selected===i);
    b.disabled=placed.has(i)||introActive;
    b.setAttribute('aria-label',`${i+1}번 딸기를 케이크에 옮기기`);
   }
  });
  $('#counter').textContent=`🍓 ${placed.size} / ${TOTAL}`;
  $('#dots').innerHTML=Array.from({length:TOTAL},(_,i)=>`<i class="${placed.size>i?'done':''}"></i>`).join('');
  if(!introActive){
   $('#mobileTip').textContent=placed.size===TOTAL?'▼ チョコプレートをクリックしてね！ ▼':'▼ いちごをケーキにドラッグしてね！ ▼';
   $('#bubble').innerHTML=placed.size===TOTAL?'大成功！<br>おめでとう ♡':'いちごを<br>のせてね！♡';
  }
  document.querySelectorAll('.plate').forEach(p=>p.classList.toggle('ready',placed.size===TOTAL));
}
let isSettling=false;
// The SAME strawberry <img> is lifted out of its original tray button.
// That slot is visibly empty as soon as a touch starts; no second berry is drawn.
function startDrag(e){
 if(e.button!==0||drag!==null||isSettling||introActive)return;
 const button=e.currentTarget;
 const i=Number(button.dataset.index);if(placed.has(i))return;
 e.preventDefault();selected=null;
 const r=button.getBoundingClientRect();
 const berry=button.querySelector('img');
 if(!berry)return;
 const ghost=document.createElement('div');ghost.className='drag-ghost';
 ghost.style.width=Math.max(35,Math.min(94,r.width))+'px';
 ghost.style.height=Math.max(35,Math.min(94,r.height))+'px';
 ghost.append(berry); // actual source berry moved, not duplicated
 document.body.append(ghost);
 button.classList.add('dragging');
 drag={index:i,button,berry,ghost,pointerId:e.pointerId,
  startX:e.clientX,startY:e.clientY,moved:false,
  sourceX:r.left+r.width/2,sourceY:r.top+r.height/2,
  offsetX:r.left+r.width/2-e.clientX,offsetY:r.top+r.height/2-e.clientY};
 updateGhost(e.clientX,e.clientY);
 try{button.setPointerCapture(e.pointerId)}catch{}
}
function updateGhost(x,y){if(!drag)return;drag.ghost.style.left=(x+drag.offsetX)+'px';drag.ghost.style.top=(y+drag.offsetY)+'px'}
function findFreeSlot(x,y){
 const rect=activeCake().getBoundingClientRect();
 const rx=((x-rect.left)/rect.width)*100,ry=((y-rect.top)/rect.height)*100;
 const slots=currentStations();let nearest=-1,min=Infinity;
 const occupied=new Set(placed.values());
  slots.forEach((s,k)=>{if(occupied.has(k))return;const d=((rx-s[0])*rect.width/100)**2+((ry-s[1])*rect.height/100)**2;if(d<min){min=d;nearest=k}});
 return nearest;
}
function restoreDrag(d,animate){
 if(!d)return;
 const putBack=()=>{d.ghost.remove();if(d.button.isConnected){d.button.append(d.berry);d.button.classList.remove('dragging')}isSettling=false};
 if(!animate){putBack();return}
 isSettling=true;d.ghost.classList.add('landing');
 requestAnimationFrame(()=>{d.ghost.style.left=d.sourceX+'px';d.ghost.style.top=d.sourceY+'px'});
 setTimeout(putBack,180);
}
function setPlaced(berryIndex,slot){
 if(slot<0||placed.has(berryIndex)||[...placed.values()].includes(slot))return;
 placed.set(berryIndex,slot);selected=null;redraw();
 if(placed.size===TOTAL){toast('大成功！ 초콜릿 판을 눌러 편지를 열어봐 ♡');celebrate()}
 else toast(`딸기 ${placed.size}개 완성! 🍓`)
}
function finishAt(d,x,y){
 const slot=findFreeSlot(x,y);if(slot<0){restoreDrag(d,true);return}
 const rect=activeCake().getBoundingClientRect(),s=currentStations()[slot];
 isSettling=true;d.ghost.classList.add('landing');
 requestAnimationFrame(()=>{d.ghost.style.left=rect.left+rect.width*s[0]/100+'px';d.ghost.style.top=rect.top+rect.height*s[1]/100+'px'});
 setTimeout(()=>{d.ghost.remove();d.button.append(d.berry);d.button.classList.remove('dragging');isSettling=false;setPlaced(d.index,slot)},175);
}
window.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.pointerId)return;
 updateGhost(e.clientX,e.clientY);
 if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>9)drag.moved=true;
},{passive:true});
window.addEventListener('pointerup',e=>{
 if(!drag||e.pointerId!==drag.pointerId)return;
 const d=drag;drag=null;
 const rect=activeCake().getBoundingClientRect();
 const inCake=e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom;
 if(d.moved&&inCake){finishAt(d,e.clientX,e.clientY)}
 else if(d.moved){restoreDrag(d,true);toast('케이크 위에 딸기를 올려줘!')}
 else{restoreDrag(d,false);selected=d.index;redraw();toast('케이크 위로 끌어다 놓아줘!')}
},{passive:true});
window.addEventListener('pointercancel',()=>{if(drag){const d=drag;drag=null;restoreDrag(d,false)}});
// Tap selection is also supported for accessibility / smaller phones.
function place(i,x,y){if(placed.has(i)||isSettling)return;setPlaced(i,findFreeSlot(x,y))}
document.querySelectorAll('#mobileCake,#desktopScene').forEach(scene=>scene.addEventListener('click',e=>{
 if(introActive||e.target.closest('.plate')||e.target.closest('.berry-tray'))return;
 if(selected!==null)place(selected,e.clientX,e.clientY);
}));
function celebrate(){const parent=$('#confetti');parent.innerHTML='';for(let i=0;i<27;i++){const el=document.createElement('span');el.textContent=['♡','✿','🍓','✦'][i%4];el.style.left=Math.random()*100+'vw';el.style.animationDelay=Math.random()*.6+'s';el.style.animationDuration=(2+Math.random()*1.1)+'s';parent.append(el)}setTimeout(()=>parent.innerHTML='',3900)}
$('#reset').addEventListener('click',()=>{if(drag){const d=drag;drag=null;restoreDrag(d,false)}if(isSettling)return;placed.clear();selected=null;redraw();toast('처음부터 케이크를 꾸며보자!')});
 function openLetter(){
   if(introActive)return;
   if(placed.size!==TOTAL){toast('딸기를 모두 올린 뒤 초콜릿 판을 눌러줘! 🍓');return}
   $('#overlay').classList.add('open');updateRelease();
 }
 document.querySelectorAll('.plate').forEach(p=>p.addEventListener('click',openLetter));
 function closeLetter(){$('#overlay').classList.remove('open')}
 $('#closeModal').addEventListener('click',closeLetter);
 $('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeLetter()});
 window.addEventListener('keydown',e=>{if(e.key==='Escape')closeLetter()});
 let wasReleased=false;
 function countdownFormat(ms){
   const s=Math.ceil(Math.max(0,ms)/1000);
   const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60),sec=s%60;
   const p=n=>String(n).padStart(2,'0');
   return (d?d+'일 ':'')+p(h)+':'+p(m)+':'+p(sec);
 }
 function updateRelease(){
   const left=RELEASE_AT-nowKstTimestamp();
   const unlocked=left<=0;
   const status=$('#releaseStatus');
   if(unlocked){
     status.innerHTML='💌 편지가 공개되었어 ♡';
     status.classList.add('released');
     $('#countdownBox').hidden=true;
     $('#letterPaper').textContent=LETTER_TEXT;
     $('#letterPaper').classList.add('visible');
     if(!wasReleased){wasReleased=true;if($('#overlay').classList.contains('open'))celebrate()}
   }else{
     const remain=countdownFormat(left);
     status.innerHTML='💌 편지 공개까지 <strong id="releaseClock">'+remain+'</strong>';
     status.classList.remove('released');
     $('#countdownReadout').textContent=remain;
     $('#countdownBox').hidden=false;
     $('#letterPaper').classList.remove('visible');
     $('#letterPaper').textContent='';
   }
 }
 updateRelease();
 setInterval(updateRelease,250);
 syncClock();
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){updateRelease();syncClock()}});

// Original 6/8 miniature bakery tune, synthesized in-browser (no third-party audio).
const MUSIC_BARS=[
 {root:'C3',triad:['C4','E4','G4'],melody:['E5','G5','A5','G5','E5','D5']},
 {root:'F3',triad:['F4','A4','C5'],melody:['C5','E5','G5','A5','G5','E5']},
 {root:'D3',triad:['D4','F4','A4'],melody:['F5','A5','C6','A5','F5','E5']},
 {root:'G3',triad:['G4','B4','D5'],melody:['D5','G5','B5','A5','G5','D5']},
 {root:'E3',triad:['E4','G4','B4'],melody:['E5','G5','B5','G5','E5','D5']},
 {root:'A2',triad:['A3','C4','E4'],melody:['C5','E5','A5','C6','B5','A5']},
 {root:'F3',triad:['F4','A4','C5'],melody:['A5','G5','F5','E5','D5','C5']},
 {root:'G3',triad:['G4','B4','D5'],melody:['D5','E5','G5','E5','D5','G5']}
];
const STEP_TIME=60/112/2; // gentle eighth-note swing feel
let audioCtx=null,musicTimer=null,musicStep=0,nextNoteTime=0;
function noteHz(note){
 const m=/^([A-G])(#?)(\d)$/.exec(note);if(!m)return 0;
 const offset={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0);
 return 440*Math.pow(2,((Number(m[3])+1)*12+offset-69)/12);
}
function bell(note,at,length,volume=.11,bass=false){
 if(!audioCtx||!note)return;
 const freq=noteHz(note),o=audioCtx.createOscillator(),harm=audioCtx.createOscillator();
 const g=audioCtx.createGain(),hg=audioCtx.createGain(),out=audioCtx.createGain();
 o.type=bass?'sine':'triangle';o.frequency.setValueAtTime(freq,at);
 harm.type='sine';harm.frequency.setValueAtTime(freq*2,at);
 g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(volume,at+.015);
 g.gain.exponentialRampToValueAtTime(.0001,at+length);
 hg.gain.value=bass?.05:.18;
 o.connect(g);harm.connect(hg);hg.connect(g);g.connect(out);out.gain.value=.55;out.connect(audioCtx.destination);
 o.start(at);harm.start(at);o.stop(at+length+.03);harm.stop(at+length+.03);
 o.onended=()=>{o.disconnect();harm.disconnect();hg.disconnect();g.disconnect();out.disconnect()};
}
function scheduleBarStep(step,when){
 const bar=MUSIC_BARS[Math.floor(step/6)%MUSIC_BARS.length],p=step%6;
 bell(bar.melody[p],when,STEP_TIME*(p===2||p===5?1.55:.85),.12);
 if(p===0){bell(bar.root,when,STEP_TIME*3.2,.16,true)}
 if(p===3){bell(bar.root,when,STEP_TIME*2.7,.09,true)}
 bell(bar.triad[p%3],when+.03,STEP_TIME*.95,.026);
}
function musicScheduler(){
 if(!audioCtx||audioCtx.state!=='running')return;
 while(nextNoteTime<audioCtx.currentTime+.35){scheduleBarStep(musicStep,nextNoteTime);nextNoteTime+=STEP_TIME;musicStep=(musicStep+1)%(MUSIC_BARS.length*6)}
}
async function toggleMusic(){
 const button=$('#bgmToggle');
 if(musicTimer!==null){clearInterval(musicTimer);musicTimer=null;await audioCtx.suspend();button.textContent='♫ BGM OFF';button.setAttribute('aria-pressed','false');button.setAttribute('aria-label','배경 음악 켜기');return}
 try{
  if(!audioCtx){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('No AudioContext');audioCtx=new Audio()}
  await audioCtx.resume();musicStep=0;nextNoteTime=audioCtx.currentTime+.055;musicScheduler();musicTimer=setInterval(musicScheduler,95);
  button.textContent='♫ BGM ON';button.setAttribute('aria-pressed','true');button.setAttribute('aria-label','배경 음악 끄기');
 }catch(e){toast('이 브라우저에서는 음악을 재생할 수 없어')}
}
$('#bgmToggle').addEventListener('click',toggleMusic);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&musicTimer!==null){toggleMusic()}});

redraw();
startIntro();
</script>
